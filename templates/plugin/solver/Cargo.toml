[package]
name = "__CRATE__"
version = "0.1.0"
edition = "2024"

[lib]
name = "__LIB__"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Once florecon is on crates.io, this is all you need. For local development
# against a checkout, use: florecon = { path = "../../florecon", features = ["sdk"] }
florecon = { version = "0.1", features = ["sdk"] }
serde = { version = "1", features = ["derive"] }
