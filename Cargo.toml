[package]
name = "florecon"
version = "0.1.1"
edition = "2024"
description = "Incremental financial reconciliation by min-cost flow: a conserving combinator algebra over a network-simplex core. Nothing created, nothing lost."
license = "MIT"
repository = "https://github.com/spoj/florecon"
readme = "README.md"
keywords = ["reconciliation", "min-cost-flow", "network-simplex", "finance", "matching"]
categories = ["finance", "algorithms", "mathematics"]

[package.metadata.docs.rs]
# Build docs with the full authoring SDK (Arrow Table, Plugin, derive(Record)).
features = ["sdk"]

[lib]
crate-type = ["rlib"]

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
arrow = { version = "53", default-features = false, features = ["ipc"], optional = true }
florecon-derive = { version = "0.1", path = "florecon-derive", optional = true }

[features]
serde = ["dep:serde", "dep:serde_json"]
# The plugin authoring SDK: columnar Arrow Table, Plugin trait, DescribeDoc,
# derive(Record), the wasm ABI driver + export_plugin! macro, and conformance.
sdk = ["serde", "dep:arrow", "dep:florecon-derive"]

[dev-dependencies]
csv = "1.3"
parquet = "53.0"
serde_json = "1"

[workspace]
members = [".", "florecon-derive", "plugins/interco"]

[profile.release]
opt-level = "z"
lto = true
strip = true
