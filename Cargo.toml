[package]
name = "florecon"
version = "0.1.0"
edition = "2024"
description = "Incremental financial reconciliation by min-cost flow: a conserving combinator algebra over a network-simplex core. Nothing created, nothing lost."
license = "MIT"
repository = "https://github.com/florecon/florecon"
readme = "README.md"
keywords = ["reconciliation", "min-cost-flow", "network-simplex", "finance", "matching"]
categories = ["finance", "algorithms", "mathematics"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
serde = ["dep:serde", "dep:serde_json"]
# The WASM consumption surface (C-ABI exports over linear memory).
wasm = ["serde"]

[[example]]
name = "timeit"
required-features = ["serde"]

[dev-dependencies]
csv = "1.3"
parquet = "51.0"
serde_json = "1"
