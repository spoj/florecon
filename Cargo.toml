[package]
name = "florecon"
version = "0.5.0"
edition = "2024"
description = "Reconciliation as partitioning: parse a bag of entries into groups. A small combinator algebra over identity, with a min-cost-flow leaf."
license = "MIT"
repository = "https://github.com/spoj/florecon"
readme = "README.md"
keywords = ["reconciliation", "min-cost-flow", "partition", "matching", "finance"]
categories = ["finance", "algorithms"]

[lib]
crate-type = ["rlib"]

[dependencies]
netsimplex = { version = "0.1", path = "netsimplex" }

[workspace]
members = [".", "netsimplex"]
