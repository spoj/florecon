name: build

# Build the plugin wasm and package it as a universal wheel on every push, and
# attach the wheel + raw wasm to the GitHub Release when you push a v* tag.
# No PyPI, no secrets: the wheel is a downloadable artifact your data team grabs
# from the Actions run (any push) or the Release page (tags).

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  wheel:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach assets to the tag's Release
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v8.2.0

      # Build the wasm and the wheel in one step -- the same command you run
      # locally (`florecon package`), so CI and your machine stay in lockstep.
      - name: build wasm + wheel
        run: uv run --project app florecon package

      # Run the freshly built wasm so a known-good plugin is what ships.
      - name: smoke test
        run: uv run --project app python run.py

      - name: upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            target/wasm32-unknown-unknown/release/solver.wasm
