[package]
name = "florecon-derive"
version = "0.1.5"
edition = "2024"
description = "derive(Record) for florecon plugins: one struct is the wire schema, the typed projection, and the identity."
license = "MIT"
repository = "https://github.com/spoj/florecon"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
