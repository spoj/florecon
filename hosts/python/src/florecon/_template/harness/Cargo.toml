[package]
name = "harness"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
florecon.workspace = true
solver = { path = "../solver" }
# A tiny native host: read a CSV and ship it to the plugin as an Arrow batch,
# exactly as the real host would — so the harness exercises `describe()` +
# `project` + `strategy`, not a shortcut.
arrow = { version = "53", default-features = false, features = ["ipc"] }
csv = "1"
