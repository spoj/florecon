[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "starter"
version = "0.1.0"
description = "A florecon reconciliation plugin, packaged as an installable wheel."
requires-python = ">=3.10"
dependencies = ["florecon-host"]

# `solver.wasm` is a build product (git-ignored): `florecon package` builds it
# and copies it next to __init__.py. `artifacts` forces it into the wheel despite
# .gitignore. The wheel is pure-Python plus this one data file, so it is
# universal (py3-none-any) -- build it once on any runner, it runs everywhere
# florecon-host runs. No cibuildwheel, no per-OS/arch matrix: the wasm is the
# portability layer.
[tool.hatch.build]
artifacts = ["src/starter/*.wasm"]

[tool.hatch.build.targets.wheel]
packages = ["src/starter"]
