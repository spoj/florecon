[package]
name = "netsimplex"
version = "0.1.0"
edition = "2024"
description = "A domain-agnostic min-cost transportation solver (bounded-variable network simplex)."
license = "MIT"
repository = "https://github.com/spoj/florecon"
readme = "README.md"
keywords = ["min-cost-flow", "network-simplex", "transportation", "optimization", "graph"]
categories = ["algorithms", "mathematics"]

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
serde = ["dep:serde", "dep:serde_json"]
